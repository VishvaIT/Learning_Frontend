<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./display_property.css">
    <title>Document</title>
</head>
<body>
    <!-- Syntax
     
    diaplay:value-->

    <!-- display-block
    display-inline
    display-inline-block
    display-none

    block elements like div,p,h1..(New Line--occupy full width)
    inline elements like span,a,strong..(Same Line) -->


    <!-- display-block => it will be in new line + occupy full width -->

    <div class="block">block 1</div>
    <div class="block">block 2</div>


    <!-- display-inline => it will not start in new line + it will take specific space + it ignore height & width -->

    <span class="inline">inline 1</span>
    <span class="inline">inline 2</span>


    <!-- display - inline-block => same as inline + it accepts height & width -->

    <div class="inline-block">inline-block</div>
    <div class="inline-block">inline block</div>


    <!-- display - none => hides the element -->

    <div class="display-none">display-none</div>


</body>
</html>
