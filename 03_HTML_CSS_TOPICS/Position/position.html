<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .relative{
            border:1px solid black;
            width: 400px;
            height:200px;
            /* Relative we can move entire div */
            position: relative;
            top: 100px;
            left: 100px;
        }
        .relative1{
            border:1px solid black;
            width: 400px;
            height:200px;
            /* Relative we can move entire div */
            position: relative;
            top: 100px;
            left: 100px;
        }

        .absolute{
            border: 1px solid red;
            width: 100px;
            height: 100px;
            position:absolute;
            top: 100px;
            left: 200px;
        }
        .fixed{
            width: 100px;
            height: 40px;
            background-color: aqua;
            position: fixed;
            top:500px;
            left: 800px;

        }
        .sticky{
            background-color: green;
            width: 100px;
            height: 40px;
            position:sticky;
            top: 10px;
            left: 0%;


        }
    </style>
</head>
<body>
   <!--  Static - default 

    Relative - parent(big box) / move another position but still occupyy old position 

    Absolute - inside big box(child) / it will move from normal flow

    Fixed - fixed position at one place

    Sticky- (navbar,sidebar) - to stick on place  -->

    <!-- top,bottom,right,left -->


     <div class="sticky">Sticky</div>

    <!-- <div class="relative">Relative </div> -->


    <div class="relative1">
        Relative
        <div class="absolute">
            Absolute
        </div>
    </div>

    <div class="fixed">Fixed</div>

   
</body>
</html>
