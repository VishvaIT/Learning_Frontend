<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            height: 700px;
        }
        a{
            color: red;
            text-decoration: dotted;

        }
    </style>
</head>
<body>
<!--     Three types of links in HTML are:

1.Internal Link(Another page on the same website)

2.External Link(Bring the another website link)

3.Anchor Link(Same page jumping into another section) -->


<!--Internal link - Another page opens in a same website  -->
 <a href="About.html">About</a>
 <br><br>
 <!-- External Link -  Bring to the another website open on same tab -->
  <a href="https://www.youtube.com/">YouTube</a>

  <br><br>

  <!-- External Link - should open on new tab using target="_blank" (Attribute)-->
<a href="https://www.google.com/" target="_blank">Google</a>
<br><br>


<!-- Anchor Link (jumps to another section )  using # and called in anchor tag id 

#contack - link to the destination
id - identify the destination  
-->

<a href="#contact">Contact</a>

<h1>Home</h1>
<h2 id="contact">Contact</h2>
</body>
</html>
