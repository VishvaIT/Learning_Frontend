<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Tags</title>
    <link rel="stylesheet" href="/Frontend/03_HTML_CSS_TOPICS/04_List_Tag.css">
</head>
<body>
25/08/2026

    <!-- List Tags
        1. Unordered List
        2.Ordered List
        3.Description List
    -->

    <!-- List Tag Container 
         ul - Unordered List
         ol - Ordered List
         dl - Description List
    -->
    
    <!-- List Tag
         li - list item
         dt - Description Title
         dd - Description Data 
    -->
    <!-- Type can be chaged - Attribute(Can be placed only inside the Opening Tag)-provides additional information -->

    <!-- Attribute - type -->
     <!-- ul type 
          -disc , 
           square ,
           circle ,
           none 
     -->
     <!-- ol type
           1-decimal,
           01-decimal-leading-zero,
           A-upper-alpha,
           a-lower-alpha,
           i-lower-roman/latin,
           I-upper-roman/latin,
           none 
     -->

    <!-- 1.Unordered List -->
     <ul>
        <li>Muruga</li>
        <li>Senthuren</li>
        <li>Vishva</li>
        <li>Ravanan</li>
        <li>Siva</li>
     </ul>

     <!-- 2.Unordered List -->
      <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>REACT</li>
        <li>BOOTSTRAP</li>
      </ol>

     <!-- 3.Description List -->
    <dl>
        <dt>Description Title</dt>
        <dd>Description Data1</dd>
        <dd>Description Data2</dd>
        <dd>Description Data3</dd>
        <dd>Description Data4</dd>
    </dl>

    <!-- task-3
      1.Portfolio(using html)
      2.using external css(change type)
    -->

</body>
</html>
