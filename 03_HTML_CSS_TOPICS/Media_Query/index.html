<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style1.css">
</head>
<body>
    <!-- Responsive Design -- Layout and content adjusting to our screen size(automatically)

    Media Query -- allows us to apply css styles based on the device or screen condition.
     
    Best for view--scroll only vertically
    mobile - 1column
    tablet - 2column
    laptop - 3or 4 column
    desktop - wider layout

    Synatx of  media query

    @media(condition--which screen size){
        //css 
    }

    To see Screen size -- browser screen --right click --inspect

    change background coloe for different screens
    min-width and max-width

    can use % --available space (or) px (or) rem--root font size of html (or) vh/vw -->

    <div class="container">

    </div>

    <!-- vw -- view port width
    vh -- view port height    (Without using media query we can alter using vh and vw)-->

    <div class="box">
        Box
    </div>

    <!-- (can be used to change the fonr size)rem = size relative to html font size -->
     1rem = 16px;
     2rem = 32px;

     <h1>Welcome</h1>




    
</body>
</html>
