<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/Frontend/03_HTML_CSS_TOPICS/06_Table.css">
</head>
<body>
    <!-- 
    table - creates a table
        tr - creates a row
        th - creates a table heading
        td - creates a table data
        thead - groups a table heading
        tbody - groups a table  data
        tfoot - groups a table row
        caption - used to add a table title
        rowspan - one cell to occupy multiple rows
        colspan - one cell to occupy multiple cols
    -->
        <table border="5">
            <caption>Students Data</caption>
                
                <thead>
                    <tr>
                        <th colspan="3" style="text-align: center;">IT</th>
                    </tr>
                    <tr>
                        <th>Name</th>
                        <th>Subject</th>
                        <th>Marks</th>
                    </tr>
                </thead>
                <tbody>
                        <tr>
                            <td >Senthuren</td>
                            <td>HTML</td>
                            <td>97</td>
                        </tr>
                        <tr>
                            <td rowspan="2">Murugan</td>
                            <td>CSS</td>
                            <td>99</td>
                        </tr>
                        <tr>
                            <td>JS</td>
                            <td>90</td>
                        </tr>
                </tbody>
                <tfoot>
                        <tr>
                            <td colspan="2">Average</td>
                            <td>90%</td>
                        </tr>
                </tfoot>
        </table>
</body>
</html>
