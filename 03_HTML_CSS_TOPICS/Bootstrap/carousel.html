<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>

    <!-- data-bs-ride  - automatically strats the slide
    data-bs-target - specifies which carousel the button /indicator controls
    data-bs-slide="next" - moves the next slide
    data-bs-slide="prev" - moves the prev slide -->

   
<div id="images" class="carousel slide" data-bs-ride="carousel">

    <!-- Dots -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#images"
            data-bs-slide-to="0" class="active"></button>

        <button type="button" data-bs-target="#images"
            data-bs-slide-to="1"></button>

        <button type="button" data-bs-target="#images"
            data-bs-slide-to="2"></button>
    </div>

    <!-- Images -->
    <div class="carousel-inner container">
        <div class="carousel-item active">
            <img src="./Break points.png" alt="Image 1"
                class="d-block w-100">
        </div>

        <div class="carousel-item">
            <img src="./Break points.png" alt="Image 2"
                class="d-block w-100">
        </div>

        <div class="carousel-item">
            <img src="./Break points.png" alt="Image 3"
                class="d-block w-100">
        </div>
    </div>

    <!-- Previous Button -->
    <button class="carousel-control-prev"
        type="button" data-bs-target="#images"
        data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <!-- Next Button -->
    <button class="carousel-control-next"
        type="button" data-bs-target="#images"
        data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>



     
    
    
</body>
</html>
