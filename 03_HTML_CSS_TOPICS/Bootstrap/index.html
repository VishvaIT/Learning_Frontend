<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- browser--bootstrap 5 cdn (copy and paste css) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<style>
    .container{
        border: 1px solid black;
    }
    .container-fluid{
        border: 1px solid black;
    }
</style>
<body>
    <!-- Used for css in media (Screen size)query--cdn--bootstrap5(link) -- copy and paste that link inside head --- we will give the style in class itself for bootstrap-->

    <!-- Break points -- view  -->

    <!-- container - fixed width
        container-fluid - full width(100px) -->

    <div class="container">Hello</div>
    <br>
    <div class="container-fluid">Heading</div>
    <br>
    <!-- Grid System -->
    <div class="container-fluid">
  <div class="row">
    <div class="col">Equal Column 1</div>
    <div class="col">Equal Column 2</div>
    <div class="col">Equal Column 3</div>
  </div>
  <div class="row">
    <div class="col">Equal Column 1</div>
    <div class="col">Equal Column 2</div>
    <div class="col">Equal Column 3</div>
  </div>
</div>

<br>

<div class="container">
  <div class="row">
    <div class="col border p-3">Equal Column 1</div>
    <div class="col border p-3">Equal Column 2</div>
    <div class="col border p-3">Equal Column 3</div>
  </div>
</div>

<br>

<div class="container">
    <div class="row">
        <div class="col">
            1 of 3
        </div>
        <div class="col-6">
            2 of 3(wider)
        </div>
        <div class="col">
            3 of 3
        </div>
    </div>
    <div class="row">
        <div class="col">
            1 of 3
        </div>
        <div class="col-5">
            2 of 3(wider)
        </div>
        <div class="col">
            3 of 3
        </div>
    </div>
</div>

<br>
