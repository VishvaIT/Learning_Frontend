<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Toast and modal are nearly same -->
     <div class="conntainer mt-5">
        <button class="btn btn-success" id="showToast">Show Toast</button>

        <div class="toast-container position-fixed top-0 end-0 p-3">
            <div class="toast" id="myToast">
                <div class="toast-header">
                    <strong class="me-auto">Travel Website</strong>
                    <button class="btn-close" data-bs-dismiss=""toast>

                    </button>
                </div>

                <div class="toast-body">
                    Booking Completed Successfully..
                </div>
            </div>
        </div>


     </div>
     <script>
        let button =document.getElementById("showToast");
        button.addEventListener("click",function(){
            let toast = document.getElementById("myToast");
            let obj=new bootstrap.Toast(toast);
            obj.show();
        });
     </script>


    
</body>
</html>
