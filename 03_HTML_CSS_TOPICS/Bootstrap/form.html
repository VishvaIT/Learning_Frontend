<!-- Styling the form in bootstrap -->
 <!-- form-label(name)  & form-control(input) -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
 </head>
 <body>
    <h1>Forms & Input Groups</h1>
     
    form-label
    form-control
    form-select
    form-group
    form-group-text
    form-check-control
    form-check-label
    form-floating


    <form action="">
        <label for="" class="form-label">Name</label>
        <!-- form control -sizing (sm,lg..) -->
        <input type="text" 
        class="form-control-lg" id="" >

        <!-- form-select  -- option like -->
        <select name="" class="form-select" id="">
            <option value="">1</option>
            <option value="">2</option>
            <option value="">3</option>
        </select>

        <input type="checkbox" name="" id="" class="form-check-input">
        <label for="" class="form-check-label">CSS</label>
        <input type="checkbox" name="" id="" class="form-check-input">
        <label for="" class="form-check-label">HTML</label>

        <!-- Radio -->
         <input type="radio" name="" class="form-check-input id="">

         <!-- Can do inline checkbox -->
         <label for="" ">Male</label>

         <!-- input groups (span and input box) -->
          <div class="input-group">
            <!-- sm,lg -->
            <span class="input-group-text">@</span>
            <input type="text" placeholder="Name" class="form-control" name="" id="">
          </div>

          <!-- Floating labels -->

          <div class="form-floating">
            <input type="text" class="form-control" name="" id="">
            <label for="" class="form-label">Name</label>
          </div>



          <!-- Form Validation  check in bootstrap website --valid&invalid feedback using class not separate span tag -->

          <div class="mt-3">
               <label for="" class="form-label">FirstName</label>
               <input type="text" class="form-control is-valid" name="" id="">
               <div class="valid-feedback">Valid</div>
          </div>
          
          <div class="mt-3">
               <label for="" class="form-label">LastName</label>
               <input type="text" class="form-control is-invalid" name="" id="">
               <div class="invalid-feedback">Not Valid</div>
          </div>


          <!-- Practice different types of class in bootstrap -->
           <!-- Create a validation form  --sing bootstrap not using js -->



    </form>


    <form action="" class="was-validated mt-5">
      <div>
        <label for="" class="form-label">Name</label>
        <input type="text" class="form-control" required name="" id="">
      
      <div class="valid-feedback">valid</div>
      <div class="invalid-fedback">Please fill out this field</div>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
 </body>
 </html>
